<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved theme before the first paint, so a dark page never
			// flashes white. The config modal writes the same `theme` key.
			(() => {
				try {
					const raw = localStorage.getItem('fermentario.config');
					const saved = raw ? JSON.parse(raw)?.theme : null;
					const theme = saved === 'light' || saved === 'dark' ? saved : 'system';
					const dark =
						theme === 'dark' ||
						(theme === 'system' &&
							typeof matchMedia === 'function' &&
							matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch {
					// Blocked storage keeps the light default.
				}
			})();
		</script>
		<style>
			html {
				background: #ffffff;
			}
			html.dark {
				background: #0c0a09;
			}
			#boot-loader {
				position: fixed;
				inset: 0;
				z-index: 60;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				cursor: wait;
				background: rgba(255, 255, 255, 0.28);
				-webkit-backdrop-filter: blur(8px);
				backdrop-filter: blur(8px);
				animation: boot-timeout 0.3s linear 60s forwards;
			}
			#boot-loader .boot-pill {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				border: 1px solid #e7e5e4;
				border-radius: 9999px;
				background: rgba(255, 255, 255, 0.95);
				padding: 0.5rem 0.875rem;
				font-family: ui-sans-serif, system-ui, sans-serif;
				font-size: 0.75rem;
				font-weight: 500;
				line-height: 1;
				color: #57534e;
				box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
			}
			#boot-loader .boot-spinner {
				width: 1rem;
				height: 1rem;
				border: 2px solid #e7e5e4;
				border-top-color: #f59e0b;
				border-radius: 9999px;
				animation: boot-spin 0.7s linear infinite;
			}
			html.dark #boot-loader {
				background: rgba(12, 10, 9, 0.28);
			}
			html.dark #boot-loader .boot-pill {
				border-color: #292524;
				background: rgba(28, 25, 23, 0.9);
				color: #d6d3d1;
				box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
			}
			html.dark #boot-loader .boot-spinner {
				border-color: #292524;
				border-top-color: #fbbf24;
			}
			@keyframes boot-spin {
				to { transform: rotate(360deg); }
			}
			@keyframes boot-timeout {
				to { opacity: 0; visibility: hidden; }
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-loader .boot-spinner { animation: none; }
			}
		</style>
		<noscript><style>#boot-loader { display: none; }</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-loader" role="status" aria-live="polite">
			<span class="boot-pill"><span class="boot-spinner"></span>Loading…</span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
